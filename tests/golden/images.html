<h1 id="tn-h-images" data-line="1">Images</h1>
<p data-line="3">An https image: <img src="https://example.org/circle.png" alt="A circle" title="The title" loading="lazy" decoding="async" referrerpolicy="no-referrer"></p>
<p data-line="5">An http image is not loaded: <span class="tn-blocked-image" title="Image not shown: only https addresses are loaded">A square</span></p>
<p data-line="7">A local file is not loaded: <span class="tn-blocked-image" title="Image not shown: only https addresses are loaded">A triangle</span></p>
<p data-line="9">A data address is not loaded: <span class="tn-blocked-image" title="Image not shown: only https addresses are loaded">A dot</span></p>
<p data-line="11">An image inside a link: <a href="https://example.org" rel="noopener noreferrer" target="_blank"><img src="https://example.org/logo.png" alt="A logo" loading="lazy" decoding="async" referrerpolicy="no-referrer"></a></p>
<p data-line="13">A link whose address is not kept: <span class="tn-blocked-link" title="Link removed: only http, https, mailto and #heading links are kept">click</span> and <a href="#tn-h-section">here</a>.</p>
