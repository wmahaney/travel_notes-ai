<h1>Images</h1>
<p>An https image: <img src="https://example.org/circle.png" alt="A circle" title="The title" loading="lazy" decoding="async" referrerpolicy="no-referrer"></p>
<p>An http image is not loaded: <span class="tn-blocked-image" title="Image not shown: only https addresses are loaded">A square</span></p>
<p>A local file is not loaded: <span class="tn-blocked-image" title="Image not shown: only https addresses are loaded">A triangle</span></p>
<p>A data address is not loaded: <span class="tn-blocked-image" title="Image not shown: only https addresses are loaded">A dot</span></p>
<p>An image inside a link: <a href="https://example.org" rel="noopener noreferrer" target="_blank"><img src="https://example.org/logo.png" alt="A logo" loading="lazy" decoding="async" referrerpolicy="no-referrer"></a></p>
<p>A link whose address is not kept: <span class="tn-blocked-link" title="Link removed: only http, https and mailto links are kept">click</span> and <span class="tn-blocked-link" title="Link removed: only http, https and mailto links are kept">here</span>.</p>
